<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFire</title>
    <meta name="description" content="OpenFire — kurulumsuz, tarayıcıda anında oynanan hızlı 2v2 deathmatch FPS. Gereksinim yok, indirme yok; adresi aç ve ateşe başla." />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100%;
        font-family: monospace;
      }
      canvas { display: block; }

      /* Always-on "+" reticle (no real sight model on the weapon, so this
         is the permanent aim reference — both hip-fire and ADS). */
      #crosshair {
        --reticle-color: rgba(255, 255, 255, 0.9);
        position: fixed;
        top: 50%;
        left: 50%;
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        pointer-events: none;
        z-index: 10;
      }
      #crosshair .bar {
        position: absolute;
        background: var(--reticle-color);
        mix-blend-mode: difference;
      }
      #crosshair .top { left: 50%; top: 0; width: 2px; height: 8px; margin-left: -1px; }
      #crosshair .bottom { left: 50%; bottom: 0; width: 2px; height: 8px; margin-left: -1px; }
      #crosshair .left { top: 50%; left: 0; width: 8px; height: 2px; margin-top: -1px; }
      #crosshair .right { top: 50%; right: 0; width: 8px; height: 2px; margin-top: -1px; }

      /* Classic CoD-style "X" hitmarker — two bars 90° apart from each other
         (each ±45° off the crosshair's own bars), flashed briefly on a
         confirmed hit (player or practice dummy). */
      #hitmarker-x {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        pointer-events: none;
        z-index: 11;
        opacity: 0;
        transition: opacity 0.08s ease-out;
      }
      #hitmarker-x.show { opacity: 1; }
      #hitmarker-x .bar {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 22px;
        height: 3px;
        margin: -1.5px 0 0 -11px;
        background: #ff4d4d;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
      }
      #hitmarker-x .diag1 { transform: rotate(45deg); }
      #hitmarker-x .diag2 { transform: rotate(-45deg); }

      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        color: #fff;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
        font-size: 14px;
        line-height: 1.5;
        pointer-events: none;
        z-index: 10;
        user-select: none;
      }

      #ammo {
        position: fixed;
        right: 16px;
        bottom: 16px;
        color: #fff;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
        font-size: 20px;
        text-align: right;
        pointer-events: none;
        z-index: 10;
        user-select: none;
      }
      #ammo.reloading { color: #ffcc66; }

      #scoreboard {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
        font-size: 16px;
        text-align: center;
        pointer-events: none;
        z-index: 10;
        user-select: none;
      }

      /* Live client perf/network stats, top-right. */
      #netstats {
        position: fixed;
        top: 16px;
        right: 16px;
        color: rgba(255, 255, 255, 0.75);
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
        font-size: 12px;
        text-align: right;
        line-height: 1.5;
        pointer-events: none;
        z-index: 10;
        user-select: none;
      }
      #netstats .bad { color: #ff6b6b; }
      #netstats .ok { color: #ffcc66; }

      /* Pushed down below #netstats so the two never overlap. */
      #killfeed {
        position: fixed;
        top: 78px;
        right: 16px;
        color: #fff;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
        font-size: 13px;
        text-align: right;
        line-height: 1.6;
        pointer-events: none;
        z-index: 10;
        user-select: none;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        z-index: 20;
        text-align: center;
      }
      #overlay.hidden { display: none; }
      #overlay button {
        margin-top: 12px;
        padding: 10px 24px;
        font-size: 16px;
        cursor: pointer;
      }

      /* ESC pause menu — separate from #overlay (which is reused for the
         join/death/match-end messages) so it never fights those for content. */
      #pause-menu {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        z-index: 30;
      }
      #pause-menu.hidden { display: none; }
      #pause-panel {
        background: rgba(20, 20, 24, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        padding: 28px 36px;
        min-width: 300px;
        text-align: center;
      }
      #pause-panel h1 {
        margin: 0 0 20px;
        font-size: 20px;
        letter-spacing: 1px;
      }
      #pause-panel button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 12px;
        padding: 10px 24px;
        font-size: 15px;
        font-family: monospace;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
      }
      #pause-panel button:hover { background: rgba(255, 255, 255, 0.18); }
      #pause-view-settings.hidden { display: none; }
      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 14px 0;
        font-size: 13px;
        text-align: left;
      }
      .setting-row input[type='range'] { flex: 1; accent-color: #ff4d4d; }
      .setting-value { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
      .setting-row-checkbox { justify-content: flex-start; gap: 10px; }
    </style>
  </head>
  <body>
    <div id="crosshair">
      <div class="bar top"></div>
      <div class="bar bottom"></div>
      <div class="bar left"></div>
      <div class="bar right"></div>
    </div>
    <div id="hitmarker-x">
      <div class="bar diag1"></div>
      <div class="bar diag2"></div>
    </div>
    <div id="hud"></div>
    <div id="ammo"></div>
    <div id="scoreboard"></div>
    <div id="netstats"></div>
    <div id="killfeed"></div>
    <div id="overlay">
      <div id="overlay-title">OpenFire</div>
      <div id="overlay-message">Tıkla ve savaşa katıl</div>
    </div>
    <div id="pause-menu" class="hidden">
      <div id="pause-panel">
        <div id="pause-view-main">
          <h1>Duraklatıldı</h1>
          <button id="pause-resume-btn">Devam Et</button>
          <button id="pause-settings-btn">Ayarlar</button>
        </div>
        <div id="pause-view-settings" class="hidden">
          <h1>Ayarlar</h1>
          <label class="setting-row">
            <span>Fare Hassasiyeti</span>
            <input type="range" id="setting-sensitivity" min="0.3" max="3" step="0.05" />
            <span id="setting-sensitivity-value" class="setting-value"></span>
          </label>
          <label class="setting-row">
            <span>Ses Seviyesi</span>
            <input type="range" id="setting-volume" min="0" max="1" step="0.05" />
            <span id="setting-volume-value" class="setting-value"></span>
          </label>
          <label class="setting-row setting-row-checkbox">
            <span>Y Eksenini Ters Çevir</span>
            <input type="checkbox" id="setting-invert-y" />
          </label>
          <button id="pause-back-btn">Geri</button>
        </div>
      </div>
    </div>
    <script type="module" src="/client/main.js"></script>
  </body>
</html>
